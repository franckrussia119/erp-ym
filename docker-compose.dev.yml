# Base PostgreSQL pour travailler en local :
#   docker compose -f docker-compose.dev.yml up -d
#   puis dans .env : DATABASE_URL=postgresql://ym:ym@localhost:5432/ymtransit
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ym
      POSTGRES_PASSWORD: ym
      POSTGRES_DB: ymtransit
    ports:
      - "5432:5432"
    volumes:
      - ymtransit-pg:/var/lib/postgresql/data
volumes:
  ymtransit-pg:
