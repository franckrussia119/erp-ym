<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Hors ligne · YM-TRANSIT</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f7fb; color: #0f172a; }
    .box { text-align: center; padding: 2rem; max-width: 360px; }
    .ico { width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 1.2rem; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 1.4rem; background: linear-gradient(135deg, #4f46e5, #7c3aed); }
    h1 { font-size: 1.3rem; margin: 0 0 .5rem; }
    p { color: #64748b; margin: 0 0 1.5rem; line-height: 1.5; }
    button { border: 0; background: #4f46e5; color: #fff; padding: .75rem 1.4rem; border-radius: 12px; font-size: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <div class="ico">YM</div>
    <h1>Pas de connexion</h1>
    <p>Vérifiez votre connexion internet. Vos notifications arriveront dès que l'appareil sera de nouveau en ligne.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
